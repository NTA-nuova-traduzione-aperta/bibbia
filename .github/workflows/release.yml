# A ogni tag di revisione (AA.MM, es. 26.11) genera PDF, ePub e JSON e li allega alla release.
# Si può lanciare anche a mano (Actions → Release → Run workflow) per provare i file senza tag:
# in quel caso li carica solo come artefatti del job.
name: Release

on:
  push:
    tags: ["[0-9][0-9].[0-9][0-9]"]
  workflow_dispatch:
    inputs:
      revisione:
        description: "Revisione da scrivere nei file (es. 26.11)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REV: ${{ github.event_name == 'push' && github.ref_name || inputs.revisione }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r strumenti/requisiti.txt
      - name: PDF ed ePub
        run: |
          mkdir -p dist
          python strumenti/genera.py --formato lettura --revisione "$REV" --out dist/nta.pdf
          python strumenti/genera.py --formato stampa  --revisione "$REV" --out dist/nta-stampa.pdf
          python strumenti/genera.py --formato epub    --revisione "$REV" --out dist/nta.epub
      - name: JSON
        run: python strumenti/pacchetti.py --revisione "$REV" --dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: nta-${{ env.REV }}
          path: dist/
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REV" dist/* \
            --title "NTA — Revisione $REV" \
            --notes "La Sacra Bibbia, Nuova Traduzione Aperta, revisione $REV (CC BY-SA 4.0).

          - **nta.pdf**: PDF A5 da leggere (una colonna)
          - **nta-stampa.pdf**: PDF A5 per la stampa economica (due colonne)
          - **nta.epub**: per e-reader e app di lettura
          - **nta.json**: tutto il testo in un file; **nta-libri.zip**: un file per libro
          - **interlineare.zip**: ebraico e greco con gloss e allineamento alla NTA

          Modifiche rispetto alla revisione precedente: cartella \`modifiche/\`."
